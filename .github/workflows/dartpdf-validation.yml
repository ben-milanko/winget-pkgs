name: DartPDF Microsoft Store source lookup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lookup:
    runs-on: windows-2025
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell
    steps:
      - name: Query the existing Store source without accepting agreements
        run: |
          $ErrorActionPreference = 'Stop'
          $client = Get-Command winget.exe -ErrorAction SilentlyContinue
          if (-not $client) {
            $appInstaller = Get-AppxPackage -Name Microsoft.DesktopAppInstaller | Select-Object -First 1
            if ($appInstaller) {
              $candidate = Join-Path $appInstaller.InstallLocation 'winget.exe'
              if (Test-Path -LiteralPath $candidate) { $client = Get-Item -LiteralPath $candidate }
            }
          }
          if (-not $client) { throw 'Existing WinGet client unavailable; no installation or registration attempted' }
          $wingetPath = if ($client.Source) { $client.Source } else { $client.FullName }
          & $wingetPath --version
          if ($LASTEXITCODE -ne 0) { throw "Existing client version query failed ($LASTEXITCODE)" }
          & $wingetPath source list --name msstore
          if ($LASTEXITCODE -ne 0) { throw "Existing Store source metadata query failed ($LASTEXITCODE)" }
          $stdout = Join-Path $env:RUNNER_TEMP 'dartpdf-msstore-show.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'dartpdf-msstore-error.txt'
          $lookup = Start-Process -FilePath $wingetPath -ArgumentList @('show', '--id', '9N071VSV6RGK', '--source', 'msstore', '--disable-interactivity') -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $completed = $lookup.WaitForExit(90000)
          $lookup.Refresh()
          foreach ($file in @($stdout,$stderr)) {
            if (Test-Path -LiteralPath $file) {
              Get-Content -LiteralPath $file | Where-Object { $_ -match '[A-Za-z0-9]{3}' -and $_ -notmatch 'Authorization|Bearer|Cookie|https?://\S*\?' }
            }
          }
          if (-not $completed) {
            & taskkill.exe /PID $lookup.Id /T /F
            throw 'Read-only lookup exceeded 90 seconds; only its disposable VM process tree ended'
          }
          "Store lookup exit code: $($lookup.ExitCode)"
          if ($lookup.ExitCode -ne 0) { throw 'Store source lookup did not establish DartPDF availability; no agreement acceptance or retry performed' }
          $result = Get-Content -LiteralPath $stdout -Raw
          if ($result -notmatch '9N071VSV6RGK' -or $result -notmatch 'DartPDF') { throw 'Exact product identity missing from the successful lookup' }
          'Exact DartPDF Microsoft Store source metadata found. No download, install, launch, source changes or terms acceptance performed.'
