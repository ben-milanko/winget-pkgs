name: DartPDF portable Scoop validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: candidate
      - name: Checkout pinned Scoop core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ScoopInstaller/Scoop
          ref: e6aa3b366bdee8ed138c1e0f7b85192ebdd35d0f
          persist-credentials: false
          path: scoop-root/apps/scoop/current
      - name: Checkout pinned normal Scoop main bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ScoopInstaller/Main
          ref: 37f30ebc3ccacf6688744e5100b09bbb45d2f170
          persist-credentials: false
          path: scoop-root/buckets/main
      - name: Install, inspect, launch and uninstall the portable app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:SCOOP = Join-Path $env:GITHUB_WORKSPACE 'scoop-root'
          $env:SCOOP_GLOBAL = Join-Path $env:RUNNER_TEMP 'scoop-global'
          $scoop = Join-Path $env:SCOOP 'apps/scoop/current/bin/scoop.ps1'
          New-Item -ItemType Directory -Path (Join-Path $env:SCOOP 'shims') -Force | Out-Null
          $env:XDG_CONFIG_HOME = Join-Path $env:RUNNER_TEMP 'scoop-test-config'
          $configDir = Join-Path $env:XDG_CONFIG_HOME 'scoop'
          New-Item -ItemType Directory -Path $configDir -Force | Out-Null
          @{root_path=$env:SCOOP; last_update=[DateTime]::Now.ToString('o')} | ConvertTo-Json | Set-Content (Join-Path $configDir 'config.json') -Encoding utf8
          & $scoop install (Join-Path $env:GITHUB_WORKSPACE 'candidate/dartpdf.json')
          if ($LASTEXITCODE -ne 0) { throw 'Scoop installation failed' }
          $dir = Join-Path $env:SCOOP 'apps/dartpdf/current'
          if (!(Test-Path "$dir/dart_pdf_editor_app.exe") -or !(Test-Path "$dir/dartpdf.exe")) { throw 'Installed binaries missing' }
          $sample = Join-Path $env:RUNNER_TEMP 'first-pdf-practice.pdf'
          Invoke-WebRequest 'https://github.com/ben-milanko/dart-pdf/releases/download/app-v16.0.0/first-pdf-practice.pdf' -OutFile $sample
          if ((Get-FileHash $sample -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b322bc0398ca0b5a8d4ebb63ce246a6846130d1f82a62b69e7343eb3e86f8e67') { throw 'Practice PDF hash mismatch' }
          $report = & "$dir/dartpdf.exe" inspect $sample --json
          $cliExit = $LASTEXITCODE
          Write-Output ('CLI inspect exit: ' + $cliExit)
          if ($cliExit -ne 0) { throw 'Bundled CLI inspect failed' }
          $parsed = ($report -join "`n") | ConvertFrom-Json
          if ($parsed.pageCount -ne 1) { throw 'CLI did not inspect the one-page PDF' }
          $shortcut = Join-Path $env:APPDATA 'Microsoft/Windows/Start Menu/Programs/Scoop Apps/DartPDF.lnk'
          if (!(Test-Path $shortcut)) { throw 'App shortcut missing' }
          $app = Start-Process "$dir/dart_pdf_editor_app.exe" -PassThru
          try {
            $shown = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 500
              $app.Refresh()
              if ($app.HasExited) { throw 'GUI exited before opening' }
              if ($app.MainWindowHandle -ne 0) { $shown = $true; break }
            }
            if (!$shown) { throw 'GUI window not observed; no security prompt bypass attempted' }
            Write-Output ('GUI window observed: ' + $app.MainWindowTitle)
          } finally {
            $app.Refresh()
            if (!$app.HasExited) {
              [void]$app.CloseMainWindow()
              if (!$app.WaitForExit(5000)) { Stop-Process -Id $app.Id -Force }
            }
          }
          & $scoop uninstall dartpdf
          if ($LASTEXITCODE -ne 0) { throw 'Scoop uninstall failed' }
          if (Test-Path (Join-Path $env:SCOOP 'apps/dartpdf')) { throw 'Managed application folder remains' }
          if (Test-Path $shortcut) { throw 'Application shortcut remains' }
          Write-Output 'DARTPDF_PORTABLE_SCOOP_INSTALL_GUI_CLI_UNINSTALL_PASSED'
